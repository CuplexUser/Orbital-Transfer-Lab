<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Orbital Transfer Lab">
  <defs>
    <radialGradient id="space" cx="50%" cy="40%" r="75%">
      <stop offset="0%" stop-color="#141d3d"/>
      <stop offset="100%" stop-color="#05070f"/>
    </radialGradient>
    <radialGradient id="planet" cx="34%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#9ad6ff"/>
      <stop offset="55%" stop-color="#3d7fd8"/>
      <stop offset="100%" stop-color="#11305f"/>
    </radialGradient>
    <linearGradient id="arc" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffd9a0"/>
      <stop offset="100%" stop-color="#ff9d3d"/>
    </linearGradient>
  </defs>

  <rect width="64" height="64" rx="14" fill="url(#space)"/>

  <!--
    Geometry is the real thing: a Hohmann half-ellipse with periapsis on the
    inner orbit (r = 12.5) and apoapsis on the outer (r = 24), so a = 18.25 and
    b = sqrt(12.5 * 24) = 17.32, drawn about the planet at the focus.
  -->
  <g transform="rotate(-35 32 32)">
    <circle cx="32" cy="32" r="12.5" fill="none" stroke="#64d2ff" stroke-opacity="0.45" stroke-width="1.5"/>
    <circle cx="32" cy="32" r="24" fill="none" stroke="#64d2ff" stroke-opacity="0.2" stroke-width="1.5"/>
    <path d="M 19.5 32 A 18.25 17.32 0 0 1 56 32" fill="none" stroke="url(#arc)"
          stroke-width="3.4" stroke-linecap="round"/>
  </g>

  <circle cx="32" cy="32" r="8.6" fill="url(#planet)"/>

  <!-- Δv₁, the departure burn, at periapsis on the inner orbit -->
  <circle cx="21.76" cy="39.17" r="4" fill="#ffb454" fill-opacity="0.35"/>
  <circle cx="21.76" cy="39.17" r="2.3" fill="#fff4dd"/>
  <!-- Δv₂, the circularization burn, half a revolution later at apoapsis -->
  <circle cx="51.66" cy="18.23" r="2.4" fill="#ff9d3d"/>
</svg>
